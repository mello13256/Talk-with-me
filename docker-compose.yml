services:
  db:
    image: postgres:16-alpine
    container_name: talkwithme-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: talkwithme
      POSTGRES_PASSWORD: talkwithme
      POSTGRES_DB: talkwithme
    ports:
      - "5432:5432"
    volumes:
      - talkwithme-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talkwithme -d talkwithme"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  talkwithme-pgdata:
