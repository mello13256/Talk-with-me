# Render blueprint: one web service + one managed Postgres.
# Create with: Render dashboard -> New -> Blueprint -> point at this repository.
services:
  - type: web
    name: talk-with-me
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Render terminates TLS at one proxy in front of the app.
      - key: TRUST_PROXY
        value: 1
      - key: DATABASE_URL
        fromDatabase:
          name: talk-with-me-db
          property: connectionString
      - key: DATABASE_SSL
        value: true
      # Generated once by Render and then kept for the life of the service.
      # Rotating SESSION_SECRET signs everybody out;
      # rotating PASSWORD_PEPPER invalidates every password.
      - key: SESSION_SECRET
        generateValue: true
      - key: PASSWORD_PEPPER
        generateValue: true
      - key: APP_URL
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: MAIL_DRIVER
        value: resend
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

databases:
  - name: talk-with-me-db
    plan: basic-256mb
    postgresMajorVersion: "16"
