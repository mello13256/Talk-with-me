# Render blueprint — PLANO GRATUITO, sem cartão de crédito.
#
# Banco de dados: NÃO é criado aqui. Use um Postgres gratuito externo (Neon,
# Supabase) e cole a connection string em DATABASE_URL. O banco do Render é pago.
#
# Duas limitações do plano free, ambas aceitáveis para começar e ambas
# reversíveis mudando só variáveis de ambiente:
#
#   1. O serviço hiberna após ~15 min sem acesso. A primeira visita depois disso
#      demora ~30-60s para acordar. Um monitor externo gratuito (UptimeRobot)
#      batendo em /api/health resolve.
#   2. Não há disco persistente, então os ANEXOS são perdidos quando o serviço
#      reinicia. O texto das conversas está no banco externo e sobrevive.
#      Para anexos duráveis, troque STORAGE_DRIVER para s3.
#
# A versão paga (sempre no ar, com disco e banco no Render) está em
# render-paid.yaml — renomeie para render.yaml se migrar.
services:
  - type: web
    name: talk-with-me
    runtime: node
    plan: free
    region: oregon
    # --include=dev é obrigatório: o Render define NODE_ENV=production durante o
    # build, e nesse modo o npm pula as devDependencies — que é onde vivem o
    # Vite, o plugin do React, o Tailwind e o próprio TypeScript. Sem a flag o
    # build do frontend não tem com o que compilar.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Render termina o TLS num proxy à frente do app. Sem isto o rate limit
      # veria o IP do proxy em vez do IP do visitante.
      - key: TRUST_PROXY
        value: 1

      # --- Banco de dados externo (Neon / Supabase) ------------------------
      # Cole a connection string completa. Prefira a versão "pooler".
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: true
      # Planos gratuitos de Postgres têm poucas conexões disponíveis.
      - key: DATABASE_POOL_MAX
        value: 5

      # Gerados uma vez pelo Render e mantidos pela vida do serviço.
      # Trocar SESSION_SECRET desconecta todo mundo;
      # trocar PASSWORD_PEPPER invalida TODAS as senhas.
      - key: SESSION_SECRET
        generateValue: true
      - key: PASSWORD_PEPPER
        generateValue: true

      # O Render preenche com o host do serviço, sem protocolo; o app
      # normaliza para https automaticamente.
      - key: APP_URL
        fromService:
          type: web
          name: talk-with-me
          property: host

      # --- Primeiro acesso -------------------------------------------------
      # O administrador é criado no primeiro boot, e SOMENTE se ainda não
      # existir nenhum administrador no banco. Leia a senha gerada em
      # Environment, entre, troque a senha e então REMOVA ADMIN_PASSWORD.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_NAME
        value: Atendimento

      # --- TROQUE ANTES DE ANUNCIAR PARA CLIENTES REAIS --------------------
      # console = os links de recuperação de senha só aparecem no log do Render.
      # Funciona para testar, mas seus clientes não recuperam a senha sozinhos.
      - key: MAIL_DRIVER
        value: console
      - key: ALLOW_INSECURE_MAIL
        value: true
      - key: MAIL_FROM
        value: Talk with me <no-reply@example.com>
      - key: RESEND_API_KEY
        sync: false

      # Sem disco no plano free: os anexos não sobrevivem a um reinício.
      # Troque para s3 (Supabase Storage, Cloudflare R2) quando for usar de verdade.
      - key: STORAGE_DRIVER
        value: local
      - key: MAX_UPLOAD_MB
        value: 10
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # Notificações push do navegador (opcional).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
