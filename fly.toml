# Fly.io deployment. Create the app and database with:
#   fly launch --no-deploy
#   fly postgres create --name talk-with-me-db
#   fly postgres attach talk-with-me-db      # sets DATABASE_URL
#   fly secrets set SESSION_SECRET=... PASSWORD_PEPPER=... APP_URL=https://<app>.fly.dev
#   fly deploy
app = "talk-with-me"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  TRUST_PROXY = "1"
  DATABASE_SSL = "true"
  STORAGE_DRIVER = "local"
  STORAGE_LOCAL_DIR = "/data/storage"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # WebSockets need at least one machine awake to keep connections alive.
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 400
    soft_limit = 300

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

# Required only with STORAGE_DRIVER=local: uploads must survive a redeploy.
[[mounts]]
  source = "talk_with_me_data"
  destination = "/data"
