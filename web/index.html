<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      interactive-widget=resizes-content: when the on-screen keyboard opens,
      shrink the layout viewport, not just the visual one. Under the default
      (resizes-visual) the page keeps its full height, so `100dvh` does not
      change and the keyboard covers the composer — the chat's most important
      control. Safari ignores this property and already handles the keyboard on
      its own, so it only affects the browsers that need it.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0b1220" />
    <title>Talk with me — canal privado de atendimento</title>
    <meta
      name="description"
      content="Um canal privado para falar diretamente comigo. Atendimento direto, histórico completo e envio de arquivos com segurança."
    />

    <!-- OpenGraph / redes sociais. %%APP_URL%% é substituído pelo servidor em runtime. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Talk with me" />
    <meta property="og:title" content="Talk with me — canal privado de atendimento" />
    <meta
      property="og:description"
      content="Um canal privado para falar diretamente comigo. Atendimento direto, histórico completo e envio de arquivos com segurança."
    />
    <meta property="og:url" content="%%APP_URL%%/" />
    <meta property="og:image" content="%%APP_URL%%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Talk with me — canal privado de atendimento" />
    <meta
      name="twitter:description"
      content="Um canal privado para falar diretamente comigo."
    />
    <meta name="twitter:image" content="%%APP_URL%%/og-image.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
